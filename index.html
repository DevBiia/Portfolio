    <!-- 
        - <header>: logo, nome da marca e navegação.
- <main>: <h1> com o título específico da página e seu conteúdo.
- <footer>: informações complementares.



- <header> (Cabeçalho): logo, nome do site, menu de navegação, barra de pesquisa e botão de login.

- <main> (Conteúdo principal): título da página (h1), textos, imagens, artigos, projetos, produtos, formulários e seções.

- <footer> (Rodapé): direitos autorais, redes sociais, contato, política de privacidade, termos de uso e links complementares.

    <header>
    Tag	Quando utilizar
<a>	Link para a página inicial ou logo
<img>	Logotipo
<h1>	Nome ou título principal do site
<nav>	Menu de navegação
<ul>	Lista de links do menu
<li>	Cada item do menu
<button>	Menu mobile, por exemplo
<form>	Pesquisa no site
<input>	Campo de pesquisa
     </header>
    
    <main>
        Tag	Quando utilizar
    <section>	Separar assuntos ou áreas de conteúdo
<article>	Conteúdo independente, como posts e notícias
<aside>	Conteúdo complementar
<h1>	Título principal da página
<h2> até <h6>	Hierarquia de títulos
<p>	Textos e parágrafos
<a>	Links
<img>	Imagens
<figure>	Imagens, gráficos ou ilustrações com legenda
<figcaption>	Legenda de uma figura
<ul> / <ol>	Listagens
<li>	Itens de listas
<time>	Datas e horários
<blockquote>	Citações
<code>	Trechos de código
<pre>	Blocos de código ou texto pré-formatado
<form>	Formulários
<label>	Identificação de campos
<input>	Campos de entrada
<textarea>	Textos longos
<select>	Seleção de opções
<button>	Ações e interações
    </main>
    
    <footer>
    Tag	Quando utilizar
<p>	Informações complementares
<small>	Copyright e avisos
<nav>	Links complementares
<ul>	Listas de links
<li>	Itens da lista
<a>	Links para redes sociais e outras páginas
<address>	Informações de contato
<time>	Datas relevantes
<img>	Logotipo ou imagem complementar
